<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable — AJ Fitness</title>
  <meta name="description" content="View the full weekly class schedule at AJ Fitness. Find classes for every fitness level, Monday through Saturday.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- NAVBAR (Injected by critical.js) -->
  <header id="mainNavbar"></header>

  <!-- PAGE HEADER -->
  <section class="page-header timetablePage">
    <h1 data-aos="fade-up">Class <span class="text-primary-custom">Schedule</span></h1>
    <div class="breadcrumb-custom" data-aos="fade-up" data-aos-delay="100">
      <a href="index.html">Home</a> <span>/</span> <span>Timetable</span>
    </div>
  </section>

  <!-- FULL TIMETABLE -->
  <section class="timetable-section section-padding">
    <div class="container">
      <div class="section-header text-center" data-aos="fade-up">
        <p class="subtitle">WEEKLY SCHEDULE</p>
        <h2 class="title">FULL <span>TIMETABLE</span></h2>
      </div>
      <div class="timetable-tabs" data-aos="fade-up" data-aos-delay="100">
        <ul class="nav nav-pills justify-content-center flex-wrap" id="timetableTabsFull" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-day="monday" data-bs-toggle="pill" type="button">Monday</button></li>
          <li class="nav-item"><button class="nav-link" data-day="tuesday" data-bs-toggle="pill" type="button">Tuesday</button></li>
          <li class="nav-item"><button class="nav-link" data-day="wednesday" data-bs-toggle="pill" type="button">Wednesday</button></li>
          <li class="nav-item"><button class="nav-link" data-day="thursday" data-bs-toggle="pill" type="button">Thursday</button></li>
          <li class="nav-item"><button class="nav-link" data-day="friday" data-bs-toggle="pill" type="button">Friday</button></li>
          <li class="nav-item"><button class="nav-link" data-day="saturday" data-bs-toggle="pill" type="button">Saturday</button></li>
        </ul>
        <div id="timetableContent">
          <!-- Rendered dynamically by timetable.js -->
        </div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="promo-section">
    <div class="container text-center">
      <div class="promo-content mx-auto" style="max-width:600px;">
        <h2 data-aos="fade-up">READY TO JOIN A <span class="text-primary-custom">CLASS?</span></h2>
        <p data-aos="fade-up" data-aos-delay="100">Contact us to book your spot or get a free trial session.</p>
        <a href="contact.html" class="btn-primary-custom" data-aos="fade-up" data-aos-delay="200">Book Now <span class="iconify" data-icon="mdi:arrow-right"></span></a>
      </div>
    </div>
  </section>

  <!-- FOOTER (Injected by script.js) -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" defer></script>
  <script src="assets/js/critical.js" defer></script>
  <script src="assets/js/script.js" defer></script>
  <script src="assets/js/timetable.js" defer></script>
</body>
</html>
