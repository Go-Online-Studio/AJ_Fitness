<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — AJ Fitness</title>
  <meta name="description" content="Get in touch with AJ Fitness. Visit us, call, or send a message to start your fitness journey today.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- NAVBAR (Injected by critical.js) -->
  <header id="mainNavbar"></header>

  <!-- PAGE HEADER -->
  <section class="page-header contactPage">
    <h1 data-aos="fade-up">Contact <span class="text-primary-custom">Us</span></h1>
    <div class="breadcrumb-custom" data-aos="fade-up" data-aos-delay="100">
      <a href="index.html">Home</a> <span>/</span> <span>Contact</span>
    </div>
  </section>

  <!-- CONTACT INFO CARDS -->
  <section class="section-padding" style="background:var(--dark);">
    <div class="container">
      <div class="row g-4 mb-5 justify-content-center">
        <div class="col-lg-3 col-md-6" data-aos="fade-up">
          <div class="contact-info-card">
            <div class="info-icon"><span class="iconify" data-icon="mdi:phone"></span></div>
            <div><h4>Phone</h4><p><a href="tel:+917905791668">+91 79057 91668</a></p></div>
          </div>
        </div>
        <div class="col-lg-3 col-md-6" data-aos="fade-up" data-aos-delay="100">
          <div class="contact-info-card">
            <div class="info-icon"><span class="iconify" data-icon="mdi:email"></span></div>
            <div><h4>Email</h4><p><a href="mailto:info@ajfitness.com">info@ajfitness.com</a></p></div>
          </div>
        </div>
        <div class="col-lg-3 col-md-6" data-aos="fade-up" data-aos-delay="300">
          <div class="contact-info-card">
            <div class="info-icon"><span class="iconify" data-icon="mdi:clock-outline"></span></div>
            <div><h4>Hours</h4><p>24/7 Open</p></div>
          </div>
        </div>
      </div>

      <!-- CONTACT FORM + MAP -->
      <div class="row g-5">
        <div class="col-lg-6" data-aos="fade-right">
          <div class="section-header">
            <p class="subtitle">GET IN TOUCH</p>
            <h2 class="title">SEND US A <span>MESSAGE</span></h2>
          </div>
          <form id="contactForm">
            <div class="row g-3">
              <div class="col-md-6">
                <input type="text" class="form-control form-control-custom" placeholder="Your Name" required>
              </div>
              <div class="col-md-6">
                <input type="email" class="form-control form-control-custom" placeholder="Your Email" required>
              </div>
              <div class="col-12">
                <input type="tel" class="form-control form-control-custom" placeholder="Phone Number" required>
              </div>
              <div class="col-12">
                <select class="form-control form-control-custom" required>
                  <option value="">Select Program</option>
                  <option>Muscle Building</option>
                  <option>Weight Loss</option>
                  <option>Strength & Power</option>
                  <option>Fitness & Conditioning</option>
                  <option>Personal Training</option>
                  <option>Nutrition Plans</option>
                </select>
              </div>
              <div class="col-12">
                <textarea class="form-control form-control-custom" rows="5" placeholder="Your Message"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn-whatsapp w-100 justify-content-center"><span class="iconify" data-icon="mdi:whatsapp"></span> Chat on WhatsApp</button>
              </div>
            </div>
          </form>
        </div>
        <div class="col-lg-6" data-aos="fade-left">
          <div style="background:var(--dark-2);border:1px solid rgba(255,255,255,0.05);border-radius:var(--radius-lg);overflow:hidden;height:100%;min-height:400px;">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14760.96025075036!2d73.16024202012265!3d22.34456263378423!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395fc9562c56aad3%3A0xb5ba37f40b28c84c!2sAJ%20fitness!5e0!3m2!1sen!2sin!4v1777878475057!5m2!1sen!2sin" width="100%" height="100%" style="
            border:0; filter: grayscale(1) invert(1) contrast(0.94) opacity(0.8);" allowfullscreen="" loading="lazy"></iframe>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER (Injected by script.js) -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" defer></script>
  <script src="assets/js/critical.js" defer></script>
  <script src="assets/js/script.js" defer></script>
  <script src="assets/js/whatsapp.js" defer></script>
  <script src="assets/js/whatsapp-form.js" defer></script>
</body>
</html>
