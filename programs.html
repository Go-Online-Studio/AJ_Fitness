<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programs — AJ Fitness</title>
  <meta name="description" content="Explore AJ Fitness programs: Muscle Building, Weight Loss, Strength & Power, Personal Training, and more.">
  <!-- Preload Critical -->
  <link rel="preload" fetchpriority="high" as="image" href="assets/images/BrandLogo.webp" type="image/webp">
  <link rel="preload" fetchpriority="high" as="image" href="assets/images/ProgramsBanner.webp" type="image/webp">
  <link rel="preload" fetchpriority="high" as="image" href="assets/images/programs/muscle-building.webp" type="image/webp">


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- NAVBAR (Injected by critical.js) -->
  <header id="mainNavbar"></header>

  <!-- PAGE HEADER -->
  <section class="page-header programPage">
    <h1 data-aos="fade-up">Our <span class="text-primary-custom">Programs</span></h1>
    <div class="breadcrumb-custom" data-aos="fade-up" data-aos-delay="100">
      <a href="index.html">Home</a> <span>/</span> <span>Programs</span>
    </div>
  </section>

  <!-- PROGRAMS GRID WITH FILTER -->
  <section class="section-padding">
    <div class="container">
      <div class="text-center" data-aos="fade-up">
        <div class="filter-btns justify-content-center">
          <button class="filter-btn active" data-filter="*">All Programs</button>
          <button class="filter-btn" data-filter="strength">Strength</button>
          <button class="filter-btn" data-filter="cardio">Cardio</button>
          <button class="filter-btn" data-filter="nutrition">Nutrition</button>
        </div>
      </div>
      <div class="row g-4" id="programsGrid" data-aos="fade-up" data-aos-delay="100">
        <!-- Rendered dynamically by cms.js -->
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="promo-section">
    <div class="container text-center">
      <div class="promo-content mx-auto" style="max-width:600px;">
        <h2 data-aos="fade-up">CAN'T FIND YOUR <span class="text-primary-custom">PROGRAM?</span></h2>
        <p data-aos="fade-up" data-aos-delay="100">Contact us and we'll create a custom training plan just for you.</p>
        <a href="contact.html" class="btn-primary-custom" data-aos="fade-up" data-aos-delay="200">Contact Us <span class="iconify" data-icon="mdi:arrow-right"></span></a>
      </div>
    </div>
  </section>

  <!-- FOOTER (Injected by script.js) -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" defer></script>
  <script src="assets/js/critical.js" defer></script>
  <script src="assets/js/script.js" defer></script>
  <script src="assets/js/cms.js" defer></script>
  <script src="assets/js/isotope-init.js" defer></script>
  <script src="assets/js/whatsapp.js" defer></script>
</body>
</html>
